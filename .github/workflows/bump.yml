name: Bump casks and formulas on schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *" # Every 4 hours

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ENV_HINTS: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.PAT_TOKEN }}
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: true

      - name: Tap repository
        run: |
          brew tap agammemnon/tap
          brew trust --tap agammemnon/tap

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@main
        with:
          username: ${{ github.actor }}

      - name: Bump outdated casks and formulas
        # peekcal is excluded: its audit needs plutil, which only exists on
        # macOS. It is bumped by the bump-macos job instead.
        run: |
          package_list=$(brew tap-info agammemnon/tap --json |
            jq -r '.[0] | (.formula_names[], .cask_tokens[]) | select(endswith("/peekcal") | not)')
          if [ -z "$package_list" ]; then
            echo "::error::No Linux packages were discovered; refusing to run an unscoped bump."
            exit 1
          fi
          mapfile -t packages <<< "$package_list"
          brew bump --no-fork --open-pr "${packages[@]}"

  bump-macos:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ENV_HINTS: 1
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.PAT_TOKEN }}
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Tap repository
        run: |
          brew tap agammemnon/tap
          brew trust --tap agammemnon/tap

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@main
        with:
          username: ${{ github.actor }}

      - name: Bump macOS-only casks
        run: brew bump --no-fork --open-pr agammemnon/tap/peekcal

  automerge:
    needs: [bump, bump-macos]
    # `brew bump` can update some casks before another cask fails its audit.
    # Always process any PRs that were created before that failure.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
      - name: Enable auto-merge on bump PRs
        run: |
          prs=$(gh pr list --repo "${{ github.repository }}" --state open --limit 1000 \
            --json number,headRefName,autoMergeRequest \
            --jq '.[] | select((.headRefName | startswith("bump-")) and .autoMergeRequest == null) | .number')
          failures=0
          while read -r pr; do
            [ -n "$pr" ] || continue
            echo "Enabling auto-merge for PR #$pr"
            if ! gh pr merge "$pr" --repo "${{ github.repository }}" --auto --squash; then
              echo "::error::Failed to enable auto-merge for PR #$pr"
              failures=1
            fi
          done <<< "$prs"
          exit "$failures"

  cleanup:
    needs: automerge
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Delete stale bump branches
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          branches=$(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/bump-*')
          failures=0
          while read -r branch; do
            [ -n "$branch" ] || continue
            # Check every associated PR. A failed lookup is never evidence of an orphan.
            if ! states=$(gh api --method GET --paginate --slurp \
              "repos/${{ github.repository }}/pulls" \
              -f state=all -f head="${{ github.repository_owner }}:$branch" -f per_page=100 |
              jq -r 'add | map(.state) | unique | join(",")'); then
              echo "::error::Unable to check PRs for $branch; keeping the branch."
              failures=1
              continue
            fi

            case "$states" in
              closed) ;;
              open|closed,open)
                echo "Keeping branch with an open PR: $branch"
                continue
                ;;
              "")
                echo "Keeping branch with no confirmed PR: $branch"
                continue
                ;;
              *)
                echo "::error::Unexpected PR state for $branch: $states; keeping the branch."
                failures=1
                continue
                ;;
            esac

            # Refuse deletion if another run has pushed new commits since checkout.
            expected=$(git rev-parse "refs/remotes/origin/$branch")
            echo "Deleting branch with closed PRs: $branch"
            if ! git push --force-with-lease="refs/heads/$branch:$expected" origin --delete "$branch"; then
              echo "::error::Failed to delete $branch."
              failures=1
            fi
          done <<< "$branches"
          exit "$failures"

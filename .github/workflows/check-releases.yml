name: Check Upstream Releases
on:
  workflow_dispatch:

jobs:
  check-releases:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - formula: asusctl
            project: asus-linux/asusctl
            gitlab_host: gitlab.com
            event_type: build-asusctl-bottle
          - formula: foundry
            project: GNOME/foundry
            gitlab_host: gitlab.gnome.org
            event_type: build-foundry-bottle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Check GitLab releases
        id: check
        run: |
          python3 .github/scripts/check_gitlab_release.py \
            --formula ${{ matrix.formula }} \
            --project ${{ matrix.project }} \
            --gitlab-host ${{ matrix.gitlab_host }}

      - name: Trigger bottle build if new
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          event-type: ${{ matrix.event_type }}
          client-payload: '{"version": "${{ steps.check.outputs.latest_version }}"}'